syntax = "proto3";
option java_multiple_files = true;
option java_package = "org.example.raft";
package raft;

// ============================================================
// Raft internals (server to server)
// ============================================================

service Raft {
  // One ordered, persistent replication stream from a leader to each
  // follower. Requests are bounded, disjoint pipeline batches; responses
  // acknowledge individual batches by sequence number.
  rpc Replicate(stream AppendEntriesArgument) returns (stream AppendEntriesResult);
  rpc RequestVote(RequestVoteArguments) returns (RequestVoteResult);
  // Follower linearizable reads (stage 6, behind a config flag): a follower
  // asks the leader for a confirmed read index, then waits for its own commit
  // index to reach it before serving from local committed state.
  rpc ConfirmReadIndex(ReadIndexRequest) returns (ReadIndexResult);
  // Log compaction (Raft 7): the log is in memory and bounded, so a follower
  // whose next index has fallen below the leader's first retained entry is
  // brought up to date with the leader's committed KV state instead of the
  // missing entries. Chunked so no message exceeds gRPC's inbound limit.
  rpc InstallSnapshot(stream InstallSnapshotChunk) returns (InstallSnapshotResult);
}

// Log entries are pure KV writes. Reads never enter the log: linearizable
// reads use ReadIndex, everything else serves from local state.
message LogEntryProto {
  int32 logIndex = 1;
  int32 term = 2;
  string key = 3;
  string value = 4;
  string opId = 5;
}

message AppendEntriesArgument {
  int32 leadersTerm = 1;
  int32 leadersId = 2;
  int32 prevLogIndex = 3;
  int32 prevLogTerm = 4;
  repeated LogEntryProto entries = 5;
  int32 leadersCommit = 6;
  int64 sequence = 7;
}

message AppendEntriesResult {
  int32 currentTerm = 1;
  bool isSuccessFull = 2;
  int32 followerId = 3;
  int64 sequence = 4;
  // On rejection, the earliest index the leader should retry. -1 otherwise.
  int32 nextIndexHint = 5;
}

message RequestVoteArguments {
  int32 candidatesTerm = 1;
  int32 candidateId = 2;
  int32 lastLogIndex = 3;
  int32 lastLogTerm = 4;
}

message RequestVoteResult {
  int32 currentTerm = 1;
  bool isVoteGranted = 2;
}

message ReadIndexRequest {
  int32 requesterId = 1;
}

message ReadIndexResult {
  bool success = 1;    // false: the callee is not the leader (see leaderId)
  int32 readIndex = 2; // leader's commit index, confirmed by a majority round
  int32 leaderId = 3;  // callee's best-known leader when success is false; -1 = unknown
}

// One key of the committed KV view, with the log index of the write that
// produced it (KvStore.Versioned): the index is what grading and the causal
// session frontier compare against, so it travels with the value.
message SnapshotEntry {
  string key = 1;
  string value = 2;
  int32 index = 3;
}

// Every chunk repeats the header fields so the follower can validate the
// leader's term on the first chunk and knows which snapshot the entries
// belong to; the stream's completion marks the snapshot complete.
message InstallSnapshotChunk {
  int32 leadersTerm = 1;
  int32 leadersId = 2;
  int32 lastIncludedIndex = 3;  // commit index the snapshot reflects
  int32 lastIncludedTerm = 4;   // term of the entry at lastIncludedIndex
  repeated SnapshotEntry entries = 5;
}

message InstallSnapshotResult {
  int32 currentTerm = 1;
  bool success = 2;  // false only when the leader's term is stale
}

// ============================================================
// Client message payloads
// ============================================================
//
// Client traffic uses the persistent framed Netty transport. Protobuf remains
// the payload format for admitted requests and normal responses, but there is
// deliberately no per-request gRPC service. The transport reads its fixed
// admission header and can reject before parsing KvRequest.

// MongoDB-style read levels on Raft. LOCAL serves from the replica's log
// (may contain uncommitted entries a leader change can roll back), MAJORITY
// serves from majority-committed state.
enum ReadLevel {
  EVENTUAL_LOCAL = 0;
  EVENTUAL_MAJORITY = 1;
  CAUSAL_LOCAL = 2;
  CAUSAL_MAJORITY = 3;
  LINEARIZABLE = 4;
}

// Log indices in this protocol are 0-based; -1 means "none". Clients must
// set the session index fields explicitly on every request. The request
// carries no consistency level, no deadline, and no profit values: the
// server chooses the level from the registered SLA (applicationId, slaId)
// and the current shadow price.
message KvRequest {
  int64 requestId = 1;
  int32 applicationId = 2;
  int32 slaId = 3;
  bool isRead = 4;
  string key = 5;
  string value = 6;                  // writes only
  // The session's causal frontier: the highest log index of anything the
  // session has written or read (-1 = none). Causal levels wait for the
  // serving view to cover it. One log position suffices because everything
  // causally before an entry has a smaller index in the single Raft log.
  int64 sessionIndex = 8;
  reserved 7; // was committedSessionIndex; never consumed by any reader
  double rttEstimateMs = 9;          // client's RTT estimate to this server

  // 10, 11 were the stage 2 forced-level fields, removed with the scorer.
  reserved 10, 11;

  // Client-decided target, sent only in the non-chameleon modes (the server
  // scorer ignores them). The wait bound is the client's d_max analog,
  // target threshold minus RTT estimate; the server clamps it to maxWaitMs.
  bool wantLinearizable = 12;        // reads: run the ReadIndex round
  int32 requestedWriteConcern = 13;  // writes: acks to wait for (1..majority)
  double waitBoundMs = 14;           // clamp on this request's server-side wait; <=0 = maxWaitMs
  // Client-decided target read level (non-chameleon modes). The KV server
  // ignores it (its client-decided path serves the committed view and the
  // client grades); the MongoDB transport needs it to choose readConcern and
  // afterClusterTime up front, since a MongoDB read returns one view.
  optional ReadLevel targetReadLevel = 15;
}

message KvResponse {
  int64 requestId = 1;
  bool ok = 2;
  bool notLeader = 3;                // redirect: resend to leaderId
  int32 leaderId = 4;                // valid when notLeader; -1 = unknown
  int64 valueIndex = 6;              // writes: the entry's index. Reads: log index of the value the delivered level served; -1 = absent
  ReadLevel deliveredReadLevel = 7;
  int32 deliveredWriteConcern = 8;   // replication count at acknowledgment
  bool waited = 9;                   // request waited server-side (ledger diagnostic)
  bool timedOutAndFellBack = 10;     // wait expired; served at the strongest no-wait level
  int64 logIndex = 11;               // node's last log index at reply
  int64 commitIndex = 12;            // node's commit index at reply
  double serviceTimeMs = 13;         // reply time minus t_recv, monotonic clock
  bool rejected = 14;                // admission control shed this request (max V_c <= 0 or a hard backstop)
  double predictedProfit = 16;       // E_c of the chosen level at decision time (chameleon* modes; the ledger's prediction column)

  // Both views of the key, populated on every read in every mode. Grading is
  // client-side (step 7): the client grades each view from these indices and
  // the node's log and commit indices, credits the better-paying one, and
  // advances its session frontier to that view's write index.
  int64 localValueIndex = 20;        // log index of the local (may-roll-back) value's write; -1 = absent
  int64 committedValueIndex = 22;    // log index of the majority-committed value's write; -1 = absent
  int64 serverReplyEpochMs = 23;      // wall-clock timestamp immediately before the framed response write
  bool deadlineExceeded = 24;         // expired in transport or the bounded admission queue

  // 5, 19, 21 carried the served, local and committed value strings; 15, 17,
  // 18 carried the server's own rung, realized profit and graded strength.
  // None was read by any client logic: values are identified by index, and
  // grading is client-side.
  reserved 5, 15, 17, 18, 19, 21;
}

// ============================================================
// Cluster administration (workload driver to server node)
// ============================================================
//
// Each Raft node runs in its own OS process, so the parts of the experiment
// harness that used to reach into ServerImpl objects directly - leader
// detection, simulated-failure injection, orderly teardown - go over this
// service instead. It is an experiment-harness interface, not part of the
// protocol under study.

service Admin {
  rpc GetStatus(AdminStatusRequest) returns (AdminStatusReply);
  rpc SetDropTraffic(SetDropTrafficRequest) returns (AdminAck);
  // Ack, then gracefully stop the node's gRPC server and exit the process.
  rpc Shutdown(ShutdownRequest) returns (AdminAck);
}

message AdminStatusRequest {}

message AdminStatusReply {
  int32 nodeId = 1;
  string role = 2;          // ServerCurrentStatus name: LEADER | FOLLOWER | CANDIDATE
  bool trafficDropped = 3;  // inter-server RPCs currently dropped (simulated failure)
}

message SetDropTrafficRequest {
  bool drop = 1;
}

message ShutdownRequest {}

message AdminAck {}
