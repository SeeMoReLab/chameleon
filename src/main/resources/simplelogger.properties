# slf4j-simple configuration for every main in the fat jar (WorkloadDriver, MongoClusterAdmin,
# ExperimentConfig, ServerNode). The MongoDB driver logs an INFO line every time a request
# has to wait for server selection, which under deliberate overload is thousands of lines a
# second and once made a 2.9 GB run.log; its warnings and errors (topology changes,
# exceptions in monitor threads) are kept.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.mongodb.driver=warn
org.slf4j.simpleLogger.showDateTime=false
