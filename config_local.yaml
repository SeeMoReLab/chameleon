# Experiment configuration.
#
# The loader is strict: a missing key, an unknown key (usually a typo), or an
# invalid value fails fast with an explicit error instead of falling back to a
# default. Every key below is required unless noted otherwise.

# The experiment arm: who resolves each request's subSLA target and how the
# client picks the contact server.
#   chameleon       - server-side scorer decides level and write concern;
#                     client routes reads to the lowest-RTT node
#   chameleonPileus - server-side scorer decides; client routes with the
#                     Pileus selector (expected-profit server choice)
#   pileus          - client picks (server, rung) jointly by expected profit;
#                     requests carry the target (wantLinearizable / write
#                     concern) and the server serves without deciding anything
#   strongest       - client statically targets each SLA's strongest
#                     consistency rung (reads by level, writes by concern;
#                     profit breaks ties within a level); lowest-RTT routing
#   weakest         - client statically targets each SLA's weakest rung (the
#                     floor; upgrades happen only by luck); lowest-RTT routing
mode: weakest

# Base PRNG seed. Seeds the workload generators (mix sampling, key draws,
# session picks), client routing exploration and tie-breaks, the Pileus
# selector, and the election-timeout jitter, so two runs of the same config
# face the same request stream. Timing nondeterminism still varies between
# runs; the seed removes only the RNG component.
seed: 42

cluster:
  # Number of Raft nodes. Majority = numServers/2 + 1 (write concerns and the
  # SLA validation are checked against it).
  numServers: 5
  # One host per node. Raft/admin use serverBasePort; client traffic uses the
  # dedicated framed ingress range at clientBasePort.
  serverHosts:
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
  serverBasePort: 8000
  clientBasePort: 9000
  # First-election cue: this node runs a shorter, jitter-free election
  # timeout, so it reliably wins the first election (EXPERIMENT.md puts the
  # leader in region A = node 0; set to -1 for the default random election).
  # A cue, not a constraint: if the node fails, the others elect normally,
  # and Raft safety is untouched.
  preferredLeaderId: 0

# Mode-independent server mechanics (apply to every arm).
server:
  # Clamp on every server-side wait (causal/read-index waits, write-concern
  # acks). A request whose wait expires falls back to the strongest no-wait
  # level of the same view (reads) or acks with the replication reached so
  # far (writes). Client-sent wait bounds are clamped to this too.
  maxWaitMs: 500
  # Occupancy slot budget: the time-weighted average number of requests in
  # flight the node is calibrated for (sweep_smax.sh measures it at the
  # latency knee). Utilization u = framed-admission-to-terminal slot-time /
  # (sMax * interval). The ingress event loop accepts at most 1.5x sMax
  # requests from fixed frame headers before protobuf parsing - in every mode.
  sMax: 4500
  # Leader-side write admission: entries per second charged one per admitted
  # write, refilled continuously, never returned. Calibrated from the
  # measured max commit rate (sweep_smax.sh, ~80% of it). Universal.
  replicationBudgetPerSecond: 160000
  # Maximum entries carried by one ordered message on a leader-to-follower
  # replication stream.
  maxEntriesPerReplicationBatch: 4000
  # Maximum unacknowledged replication messages per follower.
  maxInflightReplicationBatchesPerFollower: 16
  # HTTP/2 flow-control window on the server-server path, announced by the
  # Raft server and assumed by the replication channels. Sized to hold the
  # full batch window in bytes: 32 batches x 4000 entries x ~60 B/entry
  # ~= 7.5 MB, so 8 MiB covers it - otherwise the byte window, not the
  # batch cap, limits pipelining. Explicit value disables gRPC BDP
  # auto-tuning, making the window a fixed experiment parameter.
  replicationFlowControlWindowBytes: 4194304
  # Followers may serve linearizable reads by fetching a confirmed read index
  # from the leader (batched rounds) and waiting for their own commit index
  # to catch up. Relieves leader concentration at the cost of an extra hop.
  followerLinearizableReads: true
  # Decay of the service-time histograms (the scorer's per-(level, gap) CDFs
  # and omega means) per 100 ms refresh tick, in (0, 1). Effective memory is
  # about 100 ms / (1 - decay): 0.95 = ~2 s, 0.99 = ~10 s. Larger remembers
  # longer (steadier estimates, slower to adapt after load shifts or leader
  # changes); smaller forgets faster and drifts back to cold-start optimism
  # sooner when a level stops being chosen.
  histogramDecay: 0.9

# Chameleon economics: consulted only by the chameleon* modes (the price
# controller still runs otherwise, but nothing reads lambda).
chameleon:
  # Occupancy/price control interval: utilization is computed and lambda
  # updated once per interval; occupancy_<n>.csv gets one row per interval.
  controlIntervalMs: 100
  # Utilization target the shadow price regulates toward.
  uTarget: 0.85
  # Multiplicative controller gain: lambda <- max(lambdaMin, lambda * exp(eta * (u - uTarget))).
  eta: 0.1
  # Price floor. It lets lambda start from zero and stops it decaying so far
  # during idle periods that recovery takes many intervals; only its order of
  # magnitude matters relative to the rung profits. Setting it to 0 is the
  # "priceless chameleon" ablation: zero is absorbing under the
  # multiplicative update, so the price stays exactly 0 all run - the scorer
  # still decides levels, upgrades are free, and admission is only the hard
  # occupancy cap.
  lambdaMin: 0.0001

# Mode-independent client mechanics.
client:
  # Sliding-window size for the per-node RTT estimator (latency minus
  # server-reported service time, fed by every reply) and for the Pileus
  # response-time windows.
  rttWindowSize: 64
  # Redirect/failure resends before a request is given up (rejections are
  # terminal by design and never retried).
  retryLimit: 3
  # No response within this -> the client scores the request as lost.
  lostTimeoutMs: 10000
  # Shared persistent framed TCP connections per (client site, server).
  # Logical sessions multiplex over their site's pool without creating a
  # transport stream per request.
  ingressConnectionsPerServer: 16
  # Fraction of reads routed to a uniformly random server instead of the
  # routing policy's pick - applies to the Pileus selector and to lowest-RTT
  # routing alike. Keeps per-node latency windows and staleness estimates
  # fresh so a slow or recovered node can win the routing back (rejections
  # also file penalty samples; exploration re-probes recovery). Writes are
  # never explored: they must go to the leader.
  explorationFraction: 0.15
  # Admission-aware routing: each session keeps a decayed admit/reject ratio
  # per (node, SLA) - one tracker per registered SLA, read and write
  # separately, with a prior of 1 so no evidence means pAdmit = 1 and pAdmit
  # never reaches 0. Pileus multiplies each node's expected profit by the
  # requesting SLA's pAdmit(node); lowest-RTT routing minimizes rtt/pAdmit.
  # When enabled it replaces the Pileus rejection latency-penalty samples.
  admissionAwareRouting: true
  # Per-second decay of the admit/reject counters, in (0, 1); smaller
  # forgets faster (0.9 = a rejection loses half its weight in ~7 s).
  admitRateGamma: 0.9

# SLAs registered per application; requests carry only (applicationId, slaId)
# and the decision policy resolves which rung to pursue. A rung is
# (consistency requirement, end-to-end latency threshold in ms, profit).
# Read rung levels, weakest to strongest:
#   EVENTUAL_LOCAL < EVENTUAL_MAJORITY < CAUSAL_LOCAL < CAUSAL_MAJORITY < LINEARIZABLE
# Write rungs use concern instead: acknowledgments to wait for, 1..majority
# (at majority the write is committed and closes the loss window).
# At most 4 rungs per SLA (the client ledger's satisfied-rung columns are fixed).
slas:
  # A1: online shopping (EXPERIMENT.md). Almost everything is browsing, worth
  # little and stale-tolerant; checkouts must reflect what the shopper just
  # added and pay far more. Three read SLAs make value-ordered shedding
  # observable inside one application (slaId 3 is active only during flash
  # segments). Thresholds sit above the geo level costs so no rung is dead.
  - applicationId: 1
    read:
      # slaId 1, browsing: prefers session-consistent catalogue data, accepts
      # anything committed, accepts anything at all rather than nothing. The
      # only place eventual-majority appears.
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 40
            profit: 5
          - level: EVENTUAL_MAJORITY
            latencyMs: 40
            profit: 4
          - level: EVENTUAL_LOCAL
            latencyMs: 200
            profit: 1.5
      # slaId 2, checkout: the cart must reflect what the shopper just added
      # and must not reflect state that later rolls back.
      - slaId: 2
        rungs:
          - level: CAUSAL_MAJORITY
            latencyMs: 60
            profit: 50
          - level: CAUSAL_LOCAL
            latencyMs: 60
            profit: 38
          - level: EVENTUAL_LOCAL
            latencyMs: 60
            profit: 15
      # slaId 3, flash checkout: active only during flash segments. The floor
      # rises to majority-committed (no eventual rung - the application would
      # rather be refused than oversell), patience rises with it, profit only
      # modestly above ordinary checkout. The one segment where the price
      # cannot economise by downgrading; admission is the only lever.
      - slaId: 3
        rungs:
          - level: LINEARIZABLE
            latencyMs: 300
            profit: 70
          - level: CAUSAL_MAJORITY
            latencyMs: 300
            profit: 52
          - level: CAUSAL_MAJORITY
            latencyMs: 1500
            profit: 30
    # Adding to a cart should be acknowledged instantly; the order record
    # itself must be durable.
    write:
      - slaId: 1
        rungs:
          - concern: 3
            latencyMs: 200
            profit: 12
          - concern: 1
            latencyMs: 40
            profit: 8
          - concern: 1
            latencyMs: 200
            profit: 2
          - concern: 1
            latencyMs: 500
            profit: 1
  # A2: advertising-funded search/news feed. Results may be stale but the
  # reader must not see their own feed go backwards: session ordering, not
  # durability, so causal-local everywhere and the ladder varies only in the
  # deadline (Terry's consistency-favouring class). Writes are rare billing
  # events that always demand full durability - the greedy neighbour the
  # price must contain.
  - applicationId: 2
    read:
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 20
            profit: 5
          - level: CAUSAL_LOCAL
            latencyMs: 50
            profit: 4
          - level: CAUSAL_LOCAL
            latencyMs: 120
            profit: 2.5
          - level: CAUSAL_LOCAL
            latencyMs: 400
            profit: 0.25
    write:
      - slaId: 1
        rungs:
          - concern: 3
            latencyMs: 120
            profit: 18
          - concern: 3
            latencyMs: 300
            profit: 12
          - concern: 3
            latencyMs: 800
            profit: 5
          - concern: 3
            latencyMs: 2000
            profit: 0.6
  # A3: login and credential checking. Fast weak read first, authoritative
  # fallback if the check fails: linearizable-fast beats eventual-fast beats
  # linearizable-slow. Two rungs share the 150ms threshold, so a linearizable
  # result must claim the higher-paying one (the only SLA exercising that
  # deduplication). Writes are password changes / session records with a
  # real graded durability tradeoff, and the only place wc:2 appears.
  - applicationId: 3
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 150
            profit: 9
          - level: EVENTUAL_LOCAL
            latencyMs: 150
            profit: 4.5
          - level: LINEARIZABLE
            latencyMs: 600
            profit: 2
    write:
      - slaId: 1
        rungs:
          - concern: 3
            latencyMs: 150
            profit: 15
          - concern: 2
            latencyMs: 120
            profit: 10
          - concern: 1
            latencyMs: 40
            profit: 6
          - concern: 3
            latencyMs: 600
            profit: 4
  # A4: payments and account balances. Low volume, high stakes; the value
  # lives in the writes and the consistency floor rather than a blanket
  # multiplier (a balance read gates the same transaction as a checkout
  # read, but a transfer acknowledged and then lost is in a class of its
  # own). A4 should still be served and upgraded at prices that have shed
  # everyone else.
  - applicationId: 4
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 200
            profit: 50
          - level: CAUSAL_MAJORITY
            latencyMs: 100
            profit: 30
          - level: CAUSAL_MAJORITY
            latencyMs: 400
            profit: 12
    write:
      - slaId: 1
        rungs:
          - concern: 3
            latencyMs: 250
            profit: 150
          - concern: 3
            latencyMs: 1000
            profit: 60

# Failure injection: drop all inter-server RPCs on one node from the start.
nodeFailure:
  enabled: false
  failedNodeId: 0

# Failure injection: fail one node (by role) N seconds into the experiment.
timedFailure:
  enabled: false
  targetRole: FOLLOWER        # LEADER | FOLLOWER
  afterSeconds: 40

# Simulated geo latency, applied and cleared by run_all_cloudlab.sh (Linux
# tc/netem on the node's loopback; the runner rewrites cluster.serverHosts to
# distinct literal loopback IPs 127.0.1.1..N, which the delay rules and the
# servers' outgoing-connection source binding key on). A local run_all.sh run
# refuses geo-enabled configs outright; flip enabled to false for a
# no-delay smoke run on this machine.
geo:
  enabled: true
  # One-way latency in ms added from server i to server j (row i, column j);
  # numServers x numServers, the diagonal must be 0. Local topology
  # (EXPERIMENT.md): five AZs in one region, every server pair at 0.3 ms, so
  # a quorum operation costs about 1.2 ms round trip.
  interServerLatencyMs:
    - [0,   0.3, 0.3, 0.3, 0.3]
    - [0.3, 0,   0.3, 0.3, 0.3]
    - [0.3, 0.3, 0,   0.3, 0.3]
    - [0.3, 0.3, 0.3, 0,   0.3]
    - [0.3, 0.3, 0.3, 0.3, 0  ]
  # Client sites: every session belongs to one site (session s of every
  # application lives at site s mod #sites; sessionsPerApplication must
  # divide evenly). latencyMs is the one-way delay from the site to each
  # server. Site k's connections bind source IP 127.0.2.(k+1) when geo is
  # enabled, which is the address the per-site delay rules match on;
  # 127.0.0.1 stays rule-free for the driver's admin RPCs.
  #
  # Local topology (EXPERIMENT.md): one site per AZ, 0.1 ms to its own node,
  # 0.3 ms to the others. No remote site: inside one region every node is
  # equidistant, so there is no placement choice to defend and no routing
  # question to ask - the isolation config for capacity.
  clientSites:
    - { name: az0, latencyMs: [0.1, 0.3, 0.3, 0.3, 0.3] }
    - { name: az1, latencyMs: [0.3, 0.1, 0.3, 0.3, 0.3] }
    - { name: az2, latencyMs: [0.3, 0.3, 0.1, 0.3, 0.3] }
    - { name: az3, latencyMs: [0.3, 0.3, 0.3, 0.1, 0.3] }
    - { name: az4, latencyMs: [0.3, 0.3, 0.3, 0.3, 0.1] }

# The simulated workload: keys, session population, and the phase schedule.
workload:
  # Key selection; reads and writes draw from the same distribution over the
  # shared keys "user0" .. "user<keySpace-1>" (all applications contend on
  # the same dataset; session guarantees stay per-session).
  keySpace: 100000
  # uniform | zipfian. Zipfian weight of rank r is 1/(r+1)^zipfianExponent
  # (rank 0 is the hottest key); zipfianExponent is required either way but
  # only used when zipfian.
  keyDistribution: uniform
  zipfianExponent: 1.0
  # Independent session clients per application. Each session keeps its own
  # full client state - session anchors and per-key floors (so causal
  # guarantees are per session), RTT windows, and Pileus windows. All sessions
  # share the framed transport, and each request picks a session
  # uniformly within its application.
  # Sessions persist across phases, so history carries forward. Only the
  # metrics ledger is shared. Sessions spread evenly across the client sites
  # (geo.clientSites), so this must be divisible by the number of sites:
  # 60 = 12 per site across five sites (and 10 across six in the regional
  # and global configs).
  sessionsPerApplication: 60
  # Threads injecting the workload. One thread caps at roughly 200-400k
  # requests/s (per-request cost on a single core); the configured TPS is
  # split evenly across threads each 100ms tick. Sessions are sharded across
  # threads (thread t owns sessions t, t+K, ... of every application), so each
  # session is still driven by exactly one thread. Must be
  # <= sessionsPerApplication.
  injectorThreads: 15
  # Named weight vectors the phases reference. Each injected request is drawn
  # from the active phase's mix by weight: the entry fixes the application,
  # whether it is a read or a write, and the SLA it names, so the read/write
  # ratio and the per-app shares both fall out of the weights. Weights are
  # relative and global across the whole mix (they need not sum to 100, and
  # they are normalised over all entries, not per application); every entry
  # must reference an SLA registered above. The consistency-level mix is
  # never configured: the active decision policy chooses the rung per request.
  # Scenario mixes (EXPERIMENT.md): each is a day in the life of the platform
  # rather than a synthetic knob setting, which is why composition and rate
  # move together in the phase schedule below.
  mixes:
    # An ordinary day: overwhelmingly browsing, a trickle of checkouts,
    # steady logins, payments the thinnest stream (~13% writes).
    normal:
      - { applicationId: 1, type: read,  slaId: 1, weight: 32 }   # browse
      - { applicationId: 1, type: read,  slaId: 2, weight: 4 }    # checkout
      - { applicationId: 1, type: write, slaId: 1, weight: 4 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 33 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 14 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 4 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Weeks before Christmas: shopping displaces feed reading, conversion
    # creeps up, everything else follows. The system simply runs hot.
    holiday:
      - { applicationId: 1, type: read,  slaId: 1, weight: 38 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 6 }
      - { applicationId: 1, type: write, slaId: 1, weight: 5 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 26 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 12 }
      - { applicationId: 3, type: write, slaId: 1, weight: 5 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 5 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Prime Day / 11.11: far more browsing converts, cart writes multiply,
    # payments follow, the feed is ignored. Volume and value rise together.
    saleDay:
      - { applicationId: 1, type: read,  slaId: 1, weight: 26 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 14 }
      - { applicationId: 1, type: write, slaId: 1, weight: 12 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 16 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 12 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 9 }
      - { applicationId: 4, type: write, slaId: 1, weight: 3 }
    # Minutes before a flash sale: everyone signs in to position themselves.
    # A3 is write-heavy, so replication lag climbs right before the burst
    # (~25% writes).
    preFlash:
      - { applicationId: 1, type: read,  slaId: 1, weight: 18 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 3 }
      - { applicationId: 1, type: write, slaId: 1, weight: 2 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 8 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 40 }
      - { applicationId: 3, type: write, slaId: 1, weight: 20 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 6 }
      - { applicationId: 4, type: write, slaId: 1, weight: 2 }
    # A one-dollar car at noon: browsing collapses, the feed is abandoned,
    # almost everything is a checkout attempt under the flash SLA (A1 slaId
    # 3), logins still heavy under their ordinary ladder, payments a trickle
    # because only the winners pay (~27% writes).
    flash:
      - { applicationId: 1, type: read,  slaId: 1, weight: 5 }
      - { applicationId: 1, type: read,  slaId: 3, weight: 45 }   # flash checkout
      - { applicationId: 1, type: write, slaId: 1, weight: 20 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 2 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 18 }
      - { applicationId: 3, type: write, slaId: 1, weight: 5 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 3 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Immediately after: load falls off a cliff, losers drift back to
    # browsing, winners pay, so payments are briefly elevated.
    collapse:
      - { applicationId: 1, type: read,  slaId: 1, weight: 25 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 6 }
      - { applicationId: 1, type: write, slaId: 1, weight: 5 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 20 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 15 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 15 }
      - { applicationId: 4, type: write, slaId: 1, weight: 7 }
    # End of month: balances and transfers surge while browsing stays flat.
    # The mirror image of the greedy-neighbour test - the surging tenant is
    # the most valuable one, so the price should admit it and shed cheap
    # browsing to make room.
    payday:
      - { applicationId: 1, type: read,  slaId: 1, weight: 22 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 3 }
      - { applicationId: 1, type: write, slaId: 1, weight: 3 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 22 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 10 }
      - { applicationId: 3, type: write, slaId: 1, weight: 4 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 25 }
      - { applicationId: 4, type: write, slaId: 1, weight: 10 }
  # The day sequence (EXPERIMENT.md): one continuous run, sessions persist
  # throughout so history and lag carry across segments. Rates are fractions
  # of measured capacity C = 400000 (recalibrate C per deployment and scale
  # these together). The cluster is provisioned for ordinary peak plus
  # headroom, not for the flash sale: normal sits at 0.5C and the sale day
  # exceeds C.
  phases:
    - name: WarmUp          # warm up the cluster
      durationSeconds: 30
      totalTPS: 200000      # 0.5C
      mix: normal
    - name: NormalDay       # baseline: price on its floor, upgrades free
      durationSeconds: 300
      totalTPS: 200000      # 0.5C
      mix: normal
    - name: HolidayPlateau  # sustained lift; equilibrium, where oscillation would appear
      durationSeconds: 300
      totalTPS: 320000      # 0.8C
      mix: holiday
    - name: SaleDay         # Prime Day scale: rate and value rise together
      durationSeconds: 300
      totalTPS: 720000      # 1.8C
      mix: saleDay
    - name: PreFlash        # login surge; write-heavy A3 drives lag up before the burst
      durationSeconds: 120
      totalTPS: 400000      # 1.0C
      mix: preFlash
    - name: Flash           # ~60% must be refused; floor forbids downgrading
      durationSeconds: 60
      totalTPS: 1000000      # 2.5C
      mix: flash
    - name: Collapse        # load vanishes: does the price come down promptly
      durationSeconds: 120
      totalTPS: 280000      # 0.7C
      mix: collapse
    - name: Payday          # composition shifts, volume barely does; the valuable tenant surges
      durationSeconds: 300
      totalTPS: 240000      # 0.6C
      mix: payday
    - name: ReturnToNormal  # recovery, compared directly against the opening segment
      durationSeconds: 300
      totalTPS: 200000      # 0.5C
      mix: normal
    - name: CoolDown        # cool down to handle shutdown delays
      durationSeconds: 30
      totalTPS: 200000      # 0.5C
      mix: normal
