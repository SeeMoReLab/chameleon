# GENERATED by make_scale_configs.py from config_local.yaml; do not edit by hand, edit the base or the
# generator and regenerate. 21 servers in 3 zones of 7, 7, 7 (server i in zone i mod 3), 3 client sites (site k in zone k);
# one-way delay 0.1 ms within a zone and 0.3 ms between zones, servers and clients alike.
# sessionsPerApplication 60 (20 per site), and the majority write rung at concern 11
# (21 voting members; it is 3 in the five-node base). C and the phase rates are the five-node local
# calibration and have not been re-measured at this size.
# replicationBudgetPerSecond 70,000, measured at this size (CALIBRATION.md, "Scaling the server count").
# sMax 3200 and cap 9600: the five-node local values, not re-calibrated at this size.
# ingressConnectionsPerServer 6 per (site, server) pair, 378 connections in all, against the base's 400.

# Experiment configuration.
#
# The loader is strict: a missing key, an unknown key (usually a typo), or an
# invalid value fails fast with an explicit error instead of falling back to a
# default. Every key below is required unless noted otherwise.

# The experiment arm: who resolves each request's subSLA target and how the
# client picks the contact server.
#   chameleon       - server-side scorer decides level and write concern;
#                     client routes reads to the lowest-RTT node
#   chameleonPileus - server-side scorer decides; client routes with the
#                     Pileus selector (expected-profit server choice)
#   pileus          - client picks (server, rung) jointly by expected profit;
#                     requests carry the target (wantLinearizable / write
#                     concern) and the server serves without deciding anything
#   strongest       - client statically targets each SLA's strongest
#                     consistency rung (reads by level, writes by concern;
#                     profit breaks ties within a level); lowest-RTT routing
#   weakest         - client statically targets each SLA's weakest rung (the
#                     floor; upgrades happen only by luck); lowest-RTT routing
mode: pileus

# Base PRNG seed. Seeds the workload generators (mix sampling, key draws,
# session picks), client routing exploration and tie-breaks, the Pileus
# selector, and the election-timeout jitter, so two runs of the same config
# face the same request stream. Timing nondeterminism still varies between
# runs; the seed removes only the RNG component.
seed: 7

cluster:
  # Number of Raft nodes. Majority = numServers/2 + 1 (write concerns and the
  # SLA validation are checked against it).
  numServers: 21
  # One host per node. Raft/admin use serverBasePort; client traffic uses the
  # dedicated framed ingress range at clientBasePort.
  serverHosts:
    - 10.10.1.2
    - 10.10.1.3
    - 10.10.1.4
    - 10.10.1.5
    - 10.10.1.6
    - 10.10.1.7
    - 10.10.1.8
    - 10.10.1.9
    - 10.10.1.10
    - 10.10.1.11
    - 10.10.1.12
    - 10.10.1.13
    - 10.10.1.14
    - 10.10.1.15
    - 10.10.1.16
    - 10.10.1.17
    - 10.10.1.18
    - 10.10.1.19
    - 10.10.1.20
    - 10.10.1.21
    - 10.10.1.22
  serverBasePort: 8000
  clientBasePort: 9000
  # First-election cue: this node runs a shorter, jitter-free election
  # timeout, so it reliably wins the first election (EXPERIMENT.md puts the
  # leader in region A = node 0; set to -1 for the default random election).
  # A cue, not a constraint: if the node fails, the others elect normally,
  # and Raft safety is untouched.
  preferredLeaderId: 0

# Mode-independent server mechanics (apply to every arm).
server:
  # Clamp on every server-side wait (causal/read-index waits, write-concern
  # acks). A request whose wait expires falls back to the strongest no-wait
  # level of the same view (reads) or acks with the replication reached so
  # far (writes). Client-sent wait bounds are clamped to this too.
  maxWaitMs: 500
  # Most requests the ingress event loop holds before refusing new ones, and the
  # capacity of the admission queue behind it. A pure backstop: it exists so a
  # failure of the price cannot let the receive queue grow until frames arrive
  # already dead, and it should never bind while the price is working.
  #
  # Three times sMax. The ratio cap/sMax is what bounds the largest utilization
  # the price controller can ever observe, because in-flight cannot exceed the
  # cap, so it decides whether the controller can reach uTarget at all. Measured
  # on the local topology (sMax 3,200) at all three ratios, at 1C and at 2.5C:
  #
  #   1.5x (4,800)   1C: cap rejects 7.72%, price 0.00%, lambda on its floor -
  #                  the cap does all the admission and the price is inert.
  #   3x   (9,600)   1C: cap 1.04%, price 0.41%, lambda 3.0e-1. At 2.5C lambda
  #                  peaks at 235 with u held at 0.78 - regulating, not
  #                  saturated - and returns to the floor during Collapse.
  #   18.75x (60,000) 1C: cap 0.00%, price 6.09%, but u reaches 18.75 so the
  #                  controller can never reach target; at 2.5C it saturates at
  #                  lambdaMax and rejects 72% at the scorer, serving 557k/s
  #                  against 1,518k/s at 3x.
  #
  # The absolute 60,000 this replaced was chosen from the chameleon arm at 1C
  # alone. It is much worse for the arms that have no price: strongest at 1C ran
  # 92.5 ms with 17.2% violations and in-flight averaging 54,596, against 22.8 ms
  # and 0.0% at 3x, because for those arms the cap IS the admission control.
  # Comparing a regulated arm against baselines crippled that way would not be a
  # fair experiment.
  #
  # A multiplier is safe here only because lambdaMax bounds the price: in-flight
  # is still heavy-tailed (max/mean over 100 ms intervals reached 9.6x on local),
  # so the cap does clip spikes, but the clipping is small at 3x and the
  # controller absorbs the rest.
  ingressHardCapInFlight: 9600
  # Occupancy slot budget: the concurrency this node is allowed to carry.
  # Utilization u = framed-admission-to-terminal slot-time / (sMax * interval),
  # and uTarget holds the mean at 85% of the budget. The ingress event loop's
  # own ceiling is ingressHardCapInFlight above, independent of this value.
  #
  # sMax is an operating point, not a capacity to be discovered. The old
  # derivation - the primary's unregulated in-flight at C, measured with sMax
  # pinned out of reach - no longer measures anything: with the price silenced
  # in-flight has no equilibrium, so it runs to whatever the ingress cap allows
  # and the cap sets the answer. It worked only while the harness collapsed at
  # 350,000, well below capacity. It also produced a value ABOVE the machine's
  # own reach on the global topology, where the price then sat at its floor and
  # Chameleon was in effect switched off.
  #
  # Calibrated instead by sweeping sMax at the operating point (C = 1,000,000,
  # linger 5 ms, chameleon arm) and reading realized profit, which is the only
  # metric that prices both sides of the trade-off: a small budget refuses work
  # the machine could do, a large one wins throughput but pushes responses down
  # the SLA rungs. Goodput cannot choose - the deadlines are loose against
  # these latencies, so queueing never registers as a violation and goodput
  # rises monotonically with sMax. Utilization cannot choose either: u read 0.85
  # at 14 of 15 sweep points, because the controller drives u to uTarget for any
  # reachable sMax. u is a useful ceiling test (it falls below target when sMax
  # exceeds what the machine can fill) and nothing more.
  #
  # The profit curve is flat near its optimum - about 3% across a 2-4x range of
  # sMax - while run-to-run variance reaches 5-9%, so the argmax is not
  # resolvable. The chosen values are therefore monotonic in inter-node delay,
  # which the physics supports and which costs at most 2.2% profit against the
  # unconstrained best: a majority write holds its slot for the round trip to
  # the second-nearest follower, so slot demand scales with delay. Measured
  # write latency at these values is 28 / 107 / 191 ms for local / regional /
  # global. Too small a budget does not merely reject writes, it drives the
  # scorer off strong consistency: at regional sMax 1,800, 56% of writes
  # executed at the weakest level against 100% at majority here.
  #
  # local: 3,200 is the profit peak (10.63M/s, two runs 1.7% apart), 99.0% of
  # offered writes admitted, 63% of them at majority.
  # Utah c6525-25g at MTU 9000 (2026-09-24): 3,200, cap 9,600 (3x). Dwell probes at
  # C = 500,000 were flat within 2% from half to double this value; 3,200 / 6,400 /
  # 9,600 takes the best local and global points and keeps sMax increasing with
  # delay. The Clemson r6615 value was 3,200 at C = 1,000,000; the calibration text
  # above is Clemson's. CALIBRATION.md, "Hardware".
  sMax: 3200
  # Leader-side write admission: entries per second charged one per admitted
  # write, refilled continuously, never returned. Calibrated from the
  # measured max commit rate (sweep_smax.sh, ~80% of it). Universal.
  # Utah c6525-25g (2026-09-24): 105,000. Write-only probe on the local topology, strongest
  # arm so a served write is a committed write: served tracked 137,866/s at 138,011 offered
  # and plateaued at 124,000 to 132,000/s from 177,000 up, with the leader's replication
  # stream peaking at about 136,600 commits/s; 0.78 x 135,000, rounded. The Clemson
  # r6615 value was 160,000 (ceiling about 200,000). CALIBRATION.md, "Hardware".
  replicationBudgetPerSecond: 70000
  # Maximum entries carried by one ordered message on a leader-to-follower
  # replication stream.
  maxEntriesPerReplicationBatch: 4000
  # Maximum unacknowledged replication messages per follower.
  maxInflightReplicationBatchesPerFollower: 16
  # Committed log entries kept behind the commit index before they are
  # compacted away (Raft 7). The Raft log is in memory and was unbounded: it
  # filled the JVM's default 30 GiB heap after about 145M admitted writes,
  # around 1,200 s into the day sequence, and the resulting GC pauses (up to
  # 20 s against a 5 s election timeout) took the leadership down for the rest
  # of the run (CALIBRATION.md). A follower whose next entry is already
  # compacted receives the leader's committed KV state (InstallSnapshot)
  # instead, so this only needs to cover ordinary follower lag: 16 in-flight
  # batches of 4,000 entries is 64,000, and one stream restart resends from
  # the last acknowledged index. 1,000,000 is 6 s of writes at the
  # replication budget and about 300 MB per node at 2x (compaction runs one
  # window at a time).
  logRetentionEntries: 1000000
  # HTTP/2 flow-control window on the server-server path, announced by the
  # Raft server and assumed by the replication channels. Sized to hold the
  # full batch window in bytes: 32 batches x 4000 entries x ~60 B/entry
  # ~= 7.5 MB, so 8 MiB covers it - otherwise the byte window, not the
  # batch cap, limits pipelining. Explicit value disables gRPC BDP
  # auto-tuning, making the window a fixed experiment parameter.
  replicationFlowControlWindowBytes: 4194304
  # Smallest gap between two sends to the same follower when the batch is
  # short of maxEntriesPerReplicationBatch. Without it the pipeline is
  # self-clocked: a follower acknowledgement pumps the next batch at once, so
  # batch size is whatever arrived during one round trip. That makes batching
  # proportional to inter-node latency, and the local topology - which should
  # be the fastest - batched 40x worse than the global one for the same work,
  # went message-rate bound on the leader, and expired majority writes against
  # their deadlines (MONGODB_BASELINES.md). A batch at the cap never waits, so
  # catch-up and overload are unaffected; only a trickle waits, at most once.
  # 5 ms, measured on the local topology after the delay-class deduplication
  # fix: against 1 ms it raised C from 800,000 to 900,000, cut leader-to-follower
  # messages from 3,048/s to 744/s by growing the batch from 135 to 580 entries,
  # and LOWERED mean write latency (18.8 ms against 21.1 ms at 800,000) - the
  # message-rate saving outweighs the wait it adds. 10 ms is worse, collapsing
  # tracking to 71% at the top rungs. Held at 5 ms on every topology because the
  # per-follower send gap it has to exceed is 1.31 ms on local, 2.63 ms on
  # regional and 6.75 ms on global, so it binds hardest exactly where batching
  # was worst; the regional and global halves of that were not measured
  # separately against 1 ms.
  replicationLingerMs: 5.0
  # Followers may serve linearizable reads by fetching a confirmed read index
  # from the leader (batched rounds) and waiting for their own commit index
  # to catch up. Relieves leader concentration at the cost of an extra hop.
  followerLinearizableReads: true
  # Decay of the service-time histograms (the scorer's per-(level, gap) CDFs
  # and omega means) per 100 ms refresh tick, in (0, 1). Effective memory is
  # about 100 ms / (1 - decay): 0.95 = ~2 s, 0.99 = ~10 s. Larger remembers
  # longer (steadier estimates, slower to adapt after load shifts or leader
  # changes); smaller forgets faster and drifts back to cold-start optimism
  # sooner when a level stops being chosen.
  histogramDecay: 0.9

# Chameleon economics: consulted only by the chameleon* modes (the price
# controller still runs otherwise, but nothing reads lambda).
chameleon:
  # Occupancy/price control interval: utilization is computed and lambda
  # updated once per interval; occupancy_<n>.csv gets one row per interval.
  controlIntervalMs: 100
  # Utilization target the shadow price regulates toward.
  uTarget: 0.85
  # Multiplicative controller gain: lambda <- max(lambdaMin, lambda * exp(eta * (u - uTarget))).
  eta: 0.1
  # Price floor. It lets lambda start from zero and stops it decaying so far
  # during idle periods that recovery takes many intervals; only its order of
  # magnitude matters relative to the rung profits. Setting it to 0 is the
  # "priceless chameleon" ablation: zero is absorbing under the
  # multiplicative update, so the price stays exactly 0 all run - the scorer
  # still decides levels, upgrades are free, and admission is only the hard
  # occupancy cap.
  lambdaMin: 0.0001
  # Price ceiling: the largest value the shadow price may take. Purely
  # anti-windup - it changes no admission decision, because the price has
  # already refused everything well below it.
  #
  # A level survives scoring only while its expected profit exceeds
  # lambda * omega (RungScorer step 4f), so with the largest rung profit in
  # this SLA table at 150, any lambda above 150 / omega refuses every request.
  # Even an implausibly fast omega of 0.01 ms puts that saturation point at
  # 15,000, so 1e6 clears it by a factor of ~67 and can never take away
  # authority the price actually needed.
  #
  # Without a ceiling the price does not stop there. Under overload in-flight
  # is pinned by server.ingressHardCapInFlight, not by the price, so u stays
  # above uTarget no matter how high lambda climbs and the multiplicative
  # update compounds unopposed: measured on the local topology at 2.5C, u sat
  # at 18.74 for a whole 60 s Flash phase while lambda grew by 10^38 every five
  # seconds, hit Double.POSITIVE_INFINITY after 45 s, and stayed there - inf
  # times exp(negative) is still inf - so that leader refused every request for
  # the remaining 41% of the run while its followers ran normally.
  #
  # The ceiling also bounds recovery, which is proportional to log(lambdaMax):
  # decay is exp(eta * (0 - uTarget)) per interval, so returning to the floor
  # from 1e6 takes about 27 s, against roughly 460 s from the 1e167 the
  # regional topology reached and never from infinity.
  lambdaMax: 1.0e6

# Mode-independent client mechanics.
client:
  # Sliding-window size for the per-node RTT estimator (latency minus
  # server-reported service time, fed by every reply) and for the Pileus
  # response-time windows.
  rttWindowSize: 64
  # Redirect/failure resends before a request is given up (rejections are
  # terminal by design and never retried).
  retryLimit: 3
  # No response within this -> the client scores the request as lost.
  lostTimeoutMs: 10000
  # Shared persistent framed TCP connections per (client site, server).
  # Logical sessions multiplex over their site's pool without creating a
  # transport stream per request.
  ingressConnectionsPerServer: 6
  # Fraction of reads routed to a uniformly random server instead of the
  # routing policy's pick - applies to the Pileus selector and to lowest-RTT
  # routing alike. Keeps per-node latency windows and staleness estimates
  # fresh so a slow or recovered node can win the routing back (rejections
  # also file penalty samples; exploration re-probes recovery). Writes are
  # never explored: they must go to the leader.
  explorationFraction: 0.15
  # Admission-aware routing: each session keeps a decayed admit/reject ratio
  # per (node, SLA) - one tracker per registered SLA, read and write
  # separately, with a prior of 1 so no evidence means pAdmit = 1 and pAdmit
  # never reaches 0. Pileus multiplies each node's expected profit by the
  # requesting SLA's pAdmit(node); lowest-RTT routing minimizes rtt/pAdmit.
  # When enabled it replaces the Pileus rejection latency-penalty samples.
  admissionAwareRouting: true
  # Per-second decay of the admit/reject counters, in (0, 1); smaller
  # forgets faster (0.9 = a rejection loses half its weight in ~7 s).
  admitRateGamma: 0.9

# SLAs registered per application; requests carry only (applicationId, slaId)
# and the decision policy resolves which rung to pursue. A rung is
# (consistency requirement, end-to-end latency threshold in ms, profit).
# Read rung levels, weakest to strongest:
#   EVENTUAL_LOCAL < EVENTUAL_MAJORITY < CAUSAL_LOCAL < CAUSAL_MAJORITY < LINEARIZABLE
# Write rungs use concern instead: acknowledgments to wait for, 1..majority
# (at majority the write is committed and closes the loss window).
# At most 4 rungs per SLA (the client ledger's satisfied-rung columns are fixed).
slas:
  # A1: online shopping (EXPERIMENT.md). Almost everything is browsing, worth
  # little and stale-tolerant; checkouts must reflect what the shopper just
  # added and pay far more. Three read SLAs make value-ordered shedding
  # observable inside one application (slaId 3 is active only during flash
  # segments). Thresholds sit above the geo level costs so no rung is dead.
  - applicationId: 1
    read:
      # slaId 1, browsing: prefers session-consistent catalogue data, accepts
      # anything committed, accepts anything at all rather than nothing. The
      # only place eventual-majority appears.
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 40
            profit: 5
          - level: EVENTUAL_MAJORITY
            latencyMs: 40
            profit: 4
          - level: EVENTUAL_LOCAL
            latencyMs: 200
            profit: 1.5
      # slaId 2, checkout: the cart must reflect what the shopper just added
      # and must not reflect state that later rolls back.
      - slaId: 2
        rungs:
          - level: CAUSAL_MAJORITY
            latencyMs: 60
            profit: 50
          - level: CAUSAL_LOCAL
            latencyMs: 60
            profit: 38
          - level: EVENTUAL_LOCAL
            latencyMs: 60
            profit: 15
      # slaId 3, flash checkout: active only during flash segments. The floor
      # rises to majority-committed (no eventual rung - the application would
      # rather be refused than oversell), patience rises with it, profit only
      # modestly above ordinary checkout. The one segment where the price
      # cannot economise by downgrading; admission is the only lever.
      - slaId: 3
        rungs:
          - level: LINEARIZABLE
            latencyMs: 300
            profit: 70
          - level: CAUSAL_MAJORITY
            latencyMs: 300
            profit: 52
          - level: CAUSAL_MAJORITY
            latencyMs: 1500
            profit: 30
    # Adding to a cart should be acknowledged instantly; the order record
    # itself must be durable.
    write:
      - slaId: 1
        rungs:
          - concern: 11
            latencyMs: 200
            profit: 12
          - concern: 1
            latencyMs: 40
            profit: 8
          - concern: 1
            latencyMs: 200
            profit: 2
          - concern: 1
            latencyMs: 500
            profit: 1
  # A2: advertising-funded search/news feed. Results may be stale but the
  # reader must not see their own feed go backwards: session ordering, not
  # durability, so causal-local everywhere and the ladder varies only in the
  # deadline (Terry's consistency-favouring class). Writes are rare billing
  # events that always demand full durability - the greedy neighbour the
  # price must contain.
  - applicationId: 2
    read:
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 20
            profit: 5
          - level: CAUSAL_LOCAL
            latencyMs: 50
            profit: 4
          - level: CAUSAL_LOCAL
            latencyMs: 120
            profit: 2.5
          - level: CAUSAL_LOCAL
            latencyMs: 400
            profit: 0.25
    write:
      - slaId: 1
        rungs:
          - concern: 11
            latencyMs: 120
            profit: 18
          - concern: 11
            latencyMs: 300
            profit: 12
          - concern: 11
            latencyMs: 800
            profit: 5
          - concern: 11
            latencyMs: 2000
            profit: 0.6
  # A3: login and credential checking. Fast weak read first, authoritative
  # fallback if the check fails: linearizable-fast beats eventual-fast beats
  # linearizable-slow. Two rungs share the 150ms threshold, so a linearizable
  # result must claim the higher-paying one (the only SLA exercising that
  # deduplication). Writes are password changes / session records with a
  # real graded durability tradeoff, and the only place wc:2 appears.
  - applicationId: 3
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 150
            profit: 9
          - level: EVENTUAL_LOCAL
            latencyMs: 150
            profit: 4.5
          - level: LINEARIZABLE
            latencyMs: 600
            profit: 2
    write:
      - slaId: 1
        rungs:
          - concern: 11
            latencyMs: 150
            profit: 15
          - concern: 2
            latencyMs: 120
            profit: 10
          - concern: 1
            latencyMs: 40
            profit: 6
          - concern: 11
            latencyMs: 600
            profit: 4
  # A4: payments and account balances. Low volume, high stakes; the value
  # lives in the writes and the consistency floor rather than a blanket
  # multiplier (a balance read gates the same transaction as a checkout
  # read, but a transfer acknowledged and then lost is in a class of its
  # own). A4 should still be served and upgraded at prices that have shed
  # everyone else.
  - applicationId: 4
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 200
            profit: 50
          - level: CAUSAL_MAJORITY
            latencyMs: 100
            profit: 30
          - level: CAUSAL_MAJORITY
            latencyMs: 400
            profit: 12
    write:
      - slaId: 1
        rungs:
          - concern: 11
            latencyMs: 250
            profit: 150
          - concern: 11
            latencyMs: 1000
            profit: 60

# Failure injection: drop all inter-server RPCs on one node from the start.
nodeFailure:
  enabled: false
  failedNodeId: 0

# Failure schedule (Java store only; the loader rejects a non-empty one with
# transport: mongodb). Events at seconds from the workload start, strictly
# increasing: fail the LEADER the cluster has at that moment or the
# lowest-numbered healthy FOLLOWER, or recover the node that has been failed
# longest. A failed node drops every inter-server RPC and answers clients with
# failures until recovered; at most numServers - majority nodes may be failed
# at once. Empty here; config_failure_*.yaml carry the failure experiment.
#   - { atSeconds: 150, action: fail, target: LEADER }
#   - { atSeconds: 390, action: recover }
failureSchedule: []

# Simulated geo latency, applied and cleared by run_all_cloudlab.sh (Linux
# tc/netem on the node's loopback; the runner rewrites cluster.serverHosts to
# distinct literal loopback IPs 127.0.1.1..N, which the delay rules and the
# servers' outgoing-connection source binding key on). A local run_all.sh run
# refuses geo-enabled configs outright; flip enabled to false for a
# no-delay smoke run on this machine.
geo:
  clientSiteBindHosts: [10.99.0.1, 10.99.0.2, 10.99.0.3]
  enabled: true
  # One-way latency in ms added from server i to server j (row i, column j);
  # numServers x numServers, the diagonal must be 0. Local topology
  # (EXPERIMENT.md): five AZs in one region, every server pair at 0.3 ms, so
  # a quorum operation costs about 1.2 ms round trip.
  interServerLatencyMs:
    - [0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3, 0.1]
    - [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3, 0.3]
    - [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0, 0.3]
    - [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0]
  # Client sites: every session belongs to one site (session s of every
  # application lives at site s mod #sites; sessionsPerApplication must
  # divide evenly). latencyMs is the one-way delay from the site to each
  # server. Site k's connections bind source IP 127.0.2.(k+1) when geo is
  # enabled, which is the address the per-site delay rules match on;
  # 127.0.0.1 stays rule-free for the driver's admin RPCs.
  #
  # Local topology (EXPERIMENT.md): one site per AZ, 0.1 ms to its own node,
  # 0.3 ms to the others. No remote site: inside one region every node is
  # equidistant, so there is no placement choice to defend and no routing
  # question to ask - the isolation config for capacity.
  clientSites:
    - { name: az0, latencyMs: [0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3] }
    - { name: az1, latencyMs: [0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3] }
    - { name: az2, latencyMs: [0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1] }

# The simulated workload: keys, session population, and the phase schedule.
workload:
  # Key selection; reads and writes draw from the same distribution over the
  # shared keys "user0" .. "user<keySpace-1>" (all applications contend on
  # the same dataset; session guarantees stay per-session).
  keySpace: 100000
  # uniform | zipfian. Zipfian weight of rank r is 1/(r+1)^zipfianExponent
  # (rank 0 is the hottest key); zipfianExponent is required either way but
  # only used when zipfian.
  keyDistribution: uniform
  zipfianExponent: 1.0
  # Independent session clients per application. Each session keeps its own
  # full client state - session anchors and per-key floors (so causal
  # guarantees are per session), RTT windows, and Pileus windows. All sessions
  # share the framed transport, and each request picks a session
  # uniformly within its application.
  # Sessions persist across phases, so history carries forward. Only the
  # metrics ledger is shared. Sessions spread evenly across the client sites
  # (geo.clientSites), so this must be divisible by the number of sites:
  # 60 = 12 per site across five sites (and 10 across six in the regional
  # and global configs).
  sessionsPerApplication: 60
  # Threads injecting the workload. The configured TPS is split evenly across
  # threads each 100ms tick; sessions are sharded across threads (thread t owns
  # sessions t, t+K, ... of every application), so each session is still driven
  # by exactly one thread. Must be <= sessionsPerApplication.
  #
  # 30 was measured, not estimated. A single client machine emits what its
  # threads can emit, and a thread that cannot produce its 100 ms quota simply
  # under-delivers, so too few threads silently turn an overload phase into a
  # smaller one. At 15 threads the client topped out at ~1.9M requests/s and
  # produced only 75.5% of a 2.5M target; at 30 it hit 2,499,371/s, a dead hit.
  # 45 is worse than 30 - 2.74M against 2.92M at a 3.0M target, and 85,537/s of
  # expiries against 12,500/s at 2.5M - so past 30 the threads cost more in
  # contention than they add. This bounds the largest phase rate the harness can
  # honestly offer, which is what fixes C at 1,000,000 with a real 2.5C Flash.
  #
  # The figure this comment used to carry, 200-400k requests/s per thread, was
  # wrong by a factor of three or more: the measurement is ~83k/thread at 30
  # threads and never above 127k/thread at 15.
  injectorThreads: 30
  # Named weight vectors the phases reference. Each injected request is drawn
  # from the active phase's mix by weight: the entry fixes the application,
  # whether it is a read or a write, and the SLA it names, so the read/write
  # ratio and the per-app shares both fall out of the weights. Weights are
  # relative and global across the whole mix (they need not sum to 100, and
  # they are normalised over all entries, not per application); every entry
  # must reference an SLA registered above. The consistency-level mix is
  # never configured: the active decision policy chooses the rung per request.
  # Scenario mixes (EXPERIMENT.md): each is a day in the life of the platform
  # rather than a synthetic knob setting, which is why composition and rate
  # move together in the phase schedule below.
  mixes:
    # An ordinary day: overwhelmingly browsing, a trickle of checkouts,
    # steady logins, payments the thinnest stream (~13% writes).
    normal:
      - { applicationId: 1, type: read,  slaId: 1, weight: 32 }   # browse
      - { applicationId: 1, type: read,  slaId: 2, weight: 4 }    # checkout
      - { applicationId: 1, type: write, slaId: 1, weight: 4 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 33 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 14 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 4 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Weeks before Christmas: shopping displaces feed reading, conversion
    # creeps up, everything else follows. The system simply runs hot.
    holiday:
      - { applicationId: 1, type: read,  slaId: 1, weight: 38 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 6 }
      - { applicationId: 1, type: write, slaId: 1, weight: 5 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 26 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 12 }
      - { applicationId: 3, type: write, slaId: 1, weight: 5 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 5 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Prime Day / 11.11: far more browsing converts, cart writes multiply,
    # payments follow, the feed is ignored. Volume and value rise together.
    saleDay:
      - { applicationId: 1, type: read,  slaId: 1, weight: 26 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 14 }
      - { applicationId: 1, type: write, slaId: 1, weight: 12 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 16 }
      - { applicationId: 2, type: write, slaId: 1, weight: 2 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 12 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 9 }
      - { applicationId: 4, type: write, slaId: 1, weight: 3 }
    # Minutes before a flash sale: everyone signs in to position themselves.
    # A3 is write-heavy, so replication lag climbs right before the burst
    # (~25% writes).
    preFlash:
      - { applicationId: 1, type: read,  slaId: 1, weight: 18 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 3 }
      - { applicationId: 1, type: write, slaId: 1, weight: 2 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 8 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 40 }
      - { applicationId: 3, type: write, slaId: 1, weight: 20 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 6 }
      - { applicationId: 4, type: write, slaId: 1, weight: 2 }
    # A one-dollar car at noon: browsing collapses, the feed is abandoned,
    # almost everything is a checkout attempt under the flash SLA (A1 slaId
    # 3), logins still heavy under their ordinary ladder, payments a trickle
    # because only the winners pay (~27% writes).
    flash:
      - { applicationId: 1, type: read,  slaId: 1, weight: 5 }
      - { applicationId: 1, type: read,  slaId: 3, weight: 45 }   # flash checkout
      - { applicationId: 1, type: write, slaId: 1, weight: 20 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 2 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 18 }
      - { applicationId: 3, type: write, slaId: 1, weight: 5 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 3 }
      - { applicationId: 4, type: write, slaId: 1, weight: 1 }
    # Immediately after: load falls off a cliff, losers drift back to
    # browsing, winners pay, so payments are briefly elevated.
    collapse:
      - { applicationId: 1, type: read,  slaId: 1, weight: 25 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 6 }
      - { applicationId: 1, type: write, slaId: 1, weight: 5 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 20 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 15 }
      - { applicationId: 3, type: write, slaId: 1, weight: 6 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 15 }
      - { applicationId: 4, type: write, slaId: 1, weight: 7 }
    # End of month: balances and transfers surge while browsing stays flat.
    # The mirror image of the greedy-neighbour test - the surging tenant is
    # the most valuable one, so the price should admit it and shed cheap
    # browsing to make room.
    payday:
      - { applicationId: 1, type: read,  slaId: 1, weight: 22 }
      - { applicationId: 1, type: read,  slaId: 2, weight: 3 }
      - { applicationId: 1, type: write, slaId: 1, weight: 3 }
      - { applicationId: 2, type: read,  slaId: 1, weight: 22 }
      - { applicationId: 2, type: write, slaId: 1, weight: 1 }
      - { applicationId: 3, type: read,  slaId: 1, weight: 10 }
      - { applicationId: 3, type: write, slaId: 1, weight: 4 }
      - { applicationId: 4, type: read,  slaId: 1, weight: 25 }
      - { applicationId: 4, type: write, slaId: 1, weight: 10 }
  # Rates are fractions of C. On the Utah c6525-25g nodes at MTU 9000 C =
  # 500,000: the single client machine (16 cores) binds, and local binds first,
  # tracking 100% of 500,000 and 94.1% of 600,000 with the price silenced
  # (global holds 97.8% to 700,000); the injector emits 2.5C = 1,250,000 with
  # none skipped. At MTU 1500 the same client managed 400,000. The text below
  # is the Clemson r6615 calibration (C = 1,000,000); CALIBRATION.md,
  # "Hardware", keeps both sets of values.
  #
  # The day sequence (EXPERIMENT.md): one continuous run, sessions persist
  # throughout so history and lag carry across segments. Rates are fractions of
  # C, common to all three topologies because C is a property of the
  # workload, not of the deployment - only sMax is per-topology. The cluster is
  # provisioned for ordinary peak plus headroom, not for the flash sale: normal
  # sits at 0.5C and the sale day exceeds C.
  #
  # 2.5C = 2,500,000 is the largest rate the harness can honestly offer, and it
  # is close to the edge: with workload.injectorThreads at 30 a single client
  # emits 2,499,371/s on local, 2,491,616/s on regional and 2,497,747/s on
  # global, skipping 0.08% at worst, while 3,000,000 falls short by 3-10% on
  # every topology. Raising any rate past 2.5C, or lowering injectorThreads,
  # makes the phase a smaller multiple of C than it claims - the injector now
  # counts and warns about skipped budget, so check for that warning rather than
  # trusting the configured rate.
  phases:
    - name: WarmUp          # warm up the cluster
      durationSeconds: 30
      totalTPS: 250000     # 0.5C
      mix: normal
    - name: NormalDay       # baseline: price on its floor, upgrades free
      durationSeconds: 300
      totalTPS: 250000     # 0.5C
      mix: normal
    - name: HolidayPlateau  # sustained lift; equilibrium, where oscillation would appear
      durationSeconds: 300
      totalTPS: 400000     # 0.8C
      mix: holiday
    - name: SaleDay         # Prime Day scale: rate and value rise together
      durationSeconds: 300
      totalTPS: 900000    # 1.8C
      mix: saleDay
    - name: PreFlash        # login surge; write-heavy A3 drives lag up before the burst
      durationSeconds: 120
      totalTPS: 500000    # 1C
      mix: preFlash
    - name: Flash           # ~60% must be refused; floor forbids downgrading
      durationSeconds: 60
      totalTPS: 1250000    # 2.5C
      mix: flash
    - name: Collapse        # load vanishes: does the price come down promptly
      durationSeconds: 120
      totalTPS: 350000     # 0.7C
      mix: collapse
    - name: Payday          # composition shifts, volume barely does; the valuable tenant surges
      durationSeconds: 300
      totalTPS: 300000     # 0.6C
      mix: payday
    - name: ReturnToNormal  # recovery, compared directly against the opening segment
      durationSeconds: 300
      totalTPS: 250000     # 0.5C
      mix: normal
    - name: CoolDown        # cool down to handle shutdown delays
      durationSeconds: 30
      totalTPS: 250000     # 0.5C
      mix: normal
# Which store this run drives. "framed" is the Java store in this repo: the
# five ServerNodes and their own Raft replication, reached over the framed TCP
# ingress. "mongodb" instead drives five patched mongods and is configured by a
# mongodb: block after this line. Stated explicitly rather than defaulted,
# because a config that lost this line once ran a whole mongod calibration
# ladder against the Java store and produced an entirely plausible table.
transport: framed
