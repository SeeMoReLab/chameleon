# GENERATED by make_scale_configs.py from config_local_mongodb.yaml; do not edit by hand, edit the base or the
# generator and regenerate. 27 servers in 3 zones of 9, 9, 9 (server i in zone i mod 3), 3 client sites (site k in zone k);
# one-way delay 0.1 ms within a zone and 0.3 ms between zones, servers and clients alike.
# sessionsPerApplication 60 (20 per site), and the majority write rung at concern 4
# (7 voting members; it is 3 in the five-node base). C and the phase rates are the five-node local
# calibration and have not been re-measured at this size.
# replicationBudgetPerSecond 60,000: the five-node local value, not re-measured at this size.
# sMax 180 and cap 540: the five-node local values, not re-calibrated at this size.
# maxPoolSize 309 per (site, server) pair: connection ceilings of 927 on the primary and 25,029 on the client, against the base's 5,000 and 25,000.
# MongoDB allows at most 7 voting members: MongoClusterAdmin initiates members 7 to 26 with votes 0 and priority 0, and a majority write is
# w:"majority", 4 of the 7 voters (the Raft store's is 14 of 27).

# Experiment configuration.
#
# The loader is strict: a missing key, an unknown key (usually a typo), or an
# invalid value fails fast with an explicit error instead of falling back to a
# default. Every key below is required unless noted otherwise.

# The experiment arm: who resolves each request's subSLA target and how the
# client picks the contact server.
#   chameleon       - server-side scorer decides level and write concern;
#                     client routes reads to the lowest-RTT node
#   chameleonPileus - server-side scorer decides; client routes with the
#                     Pileus selector (expected-profit server choice)
#   pileus          - client picks (server, rung) jointly by expected profit;
#                     requests carry the target (wantLinearizable / write
#                     concern) and the server serves without deciding anything
#   strongest       - client statically targets each SLA's strongest
#                     consistency rung (reads by level, writes by concern;
#                     profit breaks ties within a level); lowest-RTT routing
#   weakest         - client statically targets each SLA's weakest rung (the
#                     floor; upgrades happen only by luck); lowest-RTT routing
mode: weakest

# Base PRNG seed. Seeds the workload generators (mix sampling, key draws,
# session picks), client routing exploration and tie-breaks, the Pileus
# selector, and the election-timeout jitter, so two runs of the same config
# face the same request stream. Timing nondeterminism still varies between
# runs; the seed removes only the RNG component.
seed: 42

cluster:
  # Number of Raft nodes. Majority = numServers/2 + 1 (write concerns and the
  # SLA validation are checked against it).
  numServers: 27
  # One host per node. Raft/admin use serverBasePort; client traffic uses the
  # dedicated framed ingress range at clientBasePort.
  serverHosts:
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
    - localhost
  serverBasePort: 8000
  clientBasePort: 9000
  # First-election cue: this node runs a shorter, jitter-free election
  # timeout, so it reliably wins the first election (EXPERIMENT.md puts the
  # leader in region A = node 0; set to -1 for the default random election).
  # A cue, not a constraint: if the node fails, the others elect normally,
  # and Raft safety is untouched.
  preferredLeaderId: 0

# Mode-independent server mechanics (apply to every arm).
server:
  # Clamp on every server-side wait (causal/read-index waits, write-concern
  # acks). A request whose wait expires falls back to the strongest no-wait
  # level of the same view (reads) or acks with the replication reached so
  # far (writes). Client-sent wait bounds are clamped to this too.
  maxWaitMs: 500
  # Most requests mongod holds in flight before refusing a new one on arrival,
  # in every arm; pushed as chameleonHardCapInFlight. 3 * sMax, the Java
  # store's rule (see config_local.yaml on why 3x and not 1.5x: at 1.5x the cap
  # does all the admission and the price never engages). Until the parameter
  # existed the patched mongod applied a hard-coded 1.5 * sMax and this line
  # had no effect; every mongod run before 2026-09-25 sat on that cap, which
  # the fixed arms reached for up to a quarter of the run and the chameleon
  # arms for under 70 of 18,600 samples.
  ingressHardCapInFlight: 540
  # Occupancy slot budget: the concurrency this node is allowed to carry.
  # Utilization u = slot-time / (sMax * interval), and uTarget holds the mean at
  # 85% of the budget. Pushed to mongod as chameleonSMax. replicationLingerMs
  # in this file is NOT pushed and has no effect on a mongod run: mongod uses
  # its own replication.
  #
  # Calibrated by sweeping sMax at C = 120,000 and reading realized profit, with
  # a 2.5C rung in the same run so the overload behaviour is measured rather than
  # assumed. The old derivation - unregulated in-flight at C, sMax pinned out of
  # reach - is not usable: with the price silenced there is no equilibrium, and
  # on this store the answer comes out as whatever the driver pool allows.
  #
  # The binding constraint is that the price must actually regulate. Too large an
  # sMax and u never reaches uTarget, so lambda decays to lambdaMin and stays
  # there through the whole run, overload included - which is the priceless
  # ablation, not the chameleon arm. That is what rules out the nominally
  # most profitable value on the global topology (see below).
  #
  # local: 120 earns 99.8% of the best profit at C and is the outright best
  # at 2.5C (2,100,250/s against 1,835,404 at 500), with lambda reaching 3.0
  # in overload - 30,000x its floor. Unchanged from the previous value.
  # Utah c6525-25g (2026-09-24, unchanged at MTU 9000): 180, cap 540 (3x). The dwell probe at
  # C = 90,000 put u near 0.6 here on every topology, and the values keep
  # sMax increasing with delay. The Clemson r6615 value was 120 at C = 120,000;
  # the calibration text above is Clemson's. CALIBRATION.md, "Hardware".
  sMax: 180
  # Leader-side write admission: entries per second charged one per admitted
  # write, refilled continuously, never returned. Calibrated from the
  # measured max commit rate, ~80% of it. Universal. mongod: the primary
  # served 105,800 w:1 point updates/s at 120,000 offered on the isolation
  # topology (runs/cal-writes1000_20260917_000214, weakest arm, A1 writes
  # only, pool cap 1,000) and less above that as the occupancy backstop took
  # over; 0.8 x 105,800 = 85,000.
  # Utah c6525-25g (2026-09-24): 60,000. Same probe on these nodes (weakest arm, A1 writes
  # only, local topology): served tracked 59,323/s at 59,369 offered and plateaued at 67,800
  # to 74,300/s from 79,000 up; 0.81 x 74,300, rounded for a round number. The Clemson r6615 value was 85,000 (ceiling
  # 105,800, the text above). CALIBRATION.md, "Hardware".
  replicationBudgetPerSecond: 60000
  # Maximum entries carried by one ordered message on a leader-to-follower
  # replication stream.
  maxEntriesPerReplicationBatch: 4000
  # Maximum unacknowledged replication messages per follower. The window
  # must cover the farthest follower's bandwidth-delay product or that
  # follower is pipeline-capped below the write budget and lags unboundedly:
  # Singapore at 230 ms RTT x 160k entries/s = 36,800 entries in flight;
  # 32 x 4000-entry batches (128,000) covers it with ~3.5x headroom.
  maxInflightReplicationBatchesPerFollower: 16
  # Committed log entries kept behind the commit index before they are
  # compacted away (Raft 7). The Raft log is in memory and was unbounded: it
  # filled the JVM's default 30 GiB heap after about 145M admitted writes,
  # around 1,200 s into the day sequence, and the resulting GC pauses (up to
  # 20 s against a 5 s election timeout) took the leadership down for the rest
  # of the run (CALIBRATION.md). A follower whose next entry is already
  # compacted receives the leader's committed KV state (InstallSnapshot)
  # instead, so this only needs to cover ordinary follower lag: 16 in-flight
  # batches of 4,000 entries is 64,000, and one stream restart resends from
  # the last acknowledged index. 1,000,000 is 6 s of writes at the
  # replication budget and about 300 MB per node at 2x (compaction runs one
  # window at a time).
  logRetentionEntries: 1000000
  # HTTP/2 flow-control window on the server-server path, announced by the
  # Raft server and assumed by the replication channels. Sized to hold the
  # full batch window in bytes: 32 batches x 4000 entries x ~60 B/entry
  # ~= 7.5 MB, so 8 MiB covers it - otherwise the byte window, not the
  # batch cap, limits pipelining. Explicit value disables gRPC BDP
  # auto-tuning, making the window a fixed experiment parameter.
  replicationFlowControlWindowBytes: 4194304
  # Smallest gap between two sends to the same follower when the batch is
  # short of maxEntriesPerReplicationBatch. Without it the pipeline is
  # self-clocked: a follower acknowledgement pumps the next batch at once, so
  # batch size is whatever arrived during one round trip. That makes batching
  # proportional to inter-node latency, and the local topology - which should
  # be the fastest - batched 40x worse than the global one for the same work,
  # went message-rate bound on the leader, and expired majority writes against
  # their deadlines (MONGODB_BASELINES.md). A batch at the cap never waits, so
  # catch-up and overload are unaffected; only a trickle waits, at most once.
  # 1 ms removes most of the message-rate penalty for 0.5 ms of mean added
  # write latency, against a tightest majority-write deadline of 120 ms.
  replicationLingerMs: 1.0
  # Followers may serve linearizable reads by fetching a confirmed read index
  # from the leader (batched rounds) and waiting for their own commit index
  # to catch up. Relieves leader concentration at the cost of an extra hop.
  followerLinearizableReads: false  # mongod: linearizable reads are primary-only
  # Decay of the service-time histograms (the scorer's per-(level, gap) CDFs
  # and omega means) per 100 ms refresh tick, in (0, 1). Effective memory is
  # about 100 ms / (1 - decay): 0.95 = ~2 s, 0.99 = ~10 s. Larger remembers
  # longer (steadier estimates, slower to adapt after load shifts or leader
  # changes); smaller forgets faster and drifts back to cold-start optimism
  # sooner when a level stops being chosen.
  histogramDecay: 0.9

# Chameleon economics: consulted only by the chameleon* modes (the price
# controller still runs otherwise, but nothing reads lambda).
chameleon:
  # Occupancy/price control interval: utilization is computed and lambda
  # updated once per interval; occupancy_<n>.csv gets one row per interval.
  controlIntervalMs: 100
  # Utilization target the shadow price regulates toward.
  uTarget: 0.85
  # Multiplicative controller gain: lambda <- max(lambdaMin, lambda * exp(eta * (u - uTarget))).
  eta: 0.1
  # Price floor. It lets lambda start from zero and stops it decaying so far
  # during idle periods that recovery takes many intervals; only its order of
  # magnitude matters relative to the rung profits. Setting it to 0 is the
  # "priceless chameleon" ablation: zero is absorbing under the
  # multiplicative update, so the price stays exactly 0 all run - the scorer
  # still decides levels, upgrades are free, and admission is only the hard
  # occupancy cap.
  lambdaMin: 0.0001
  # Price ceiling: the largest value the shadow price may take. Purely
  # anti-windup - it changes no admission decision, because the price has
  # already refused everything well below it.
  #
  # A level survives scoring only while its expected profit exceeds
  # lambda * omega (RungScorer step 4f), so with the largest rung profit in
  # this SLA table at 150, any lambda above 150 / omega refuses every request.
  # Even an implausibly fast omega of 0.01 ms puts that saturation point at
  # 15,000, so 1e6 clears it by a factor of ~67 and can never take away
  # authority the price actually needed.
  #
  # Without a ceiling the price does not stop there. Under overload in-flight
  # is pinned by server.ingressHardCapInFlight, not by the price, so u stays
  # above uTarget no matter how high lambda climbs and the multiplicative
  # update compounds unopposed: measured on the local topology at 2.5C, u sat
  # at 18.74 for a whole 60 s Flash phase while lambda grew by 10^38 every five
  # seconds, hit Double.POSITIVE_INFINITY after 45 s, and stayed there - inf
  # times exp(negative) is still inf - so that leader refused every request for
  # the remaining 41% of the run while its followers ran normally.
  #
  # The ceiling also bounds recovery, which is proportional to log(lambdaMax):
  # decay is exp(eta * (0 - uTarget)) per interval, so returning to the floor
  # from 1e6 takes about 27 s, against roughly 460 s from the 1e167 the
  # regional topology reached and never from infinity.
  #
  # Pushed to mongod as chameleonLambdaMax, before chameleonLambdaMin so the
  # pair is never inverted between the two setParameter calls. The patched
  # mongod had no ceiling until 2026-09-25: the day sequence took its price to
  # 1e184 (pileus) and 1e271 (strongest) on the global topology, inert in those
  # arms because the client decides there, and the chameleon arms peaked below
  # 0.5, so no result moved, but a run 15% longer would have reached infinity.
  lambdaMax: 1.0e6

# Mode-independent client mechanics.
client:
  # Sliding-window size for the per-node RTT estimator (latency minus
  # server-reported service time, fed by every reply) and for the Pileus
  # response-time windows.
  rttWindowSize: 64
  # Redirect/failure resends before a request is given up (rejections are
  # terminal by design and never retried).
  retryLimit: 3
  # No response within this -> the client scores the request as lost.
  lostTimeoutMs: 10000
  # Shared persistent framed TCP connections per (client site, server).
  # Logical sessions multiplex over their site's pool without creating a
  # transport stream per request.
  ingressConnectionsPerServer: 16
  # Fraction of reads routed to a uniformly random server instead of the
  # routing policy's pick - applies to the Pileus selector and to lowest-RTT
  # routing alike. Keeps per-node latency windows and staleness estimates
  # fresh so a slow or recovered node can win the routing back (rejections
  # also file penalty samples; exploration re-probes recovery). Writes are
  # never explored: they must go to the leader.
  explorationFraction: 0.15
  # Admission-aware routing: each session keeps a decayed admit/reject ratio
  # per (node, SLA) - one tracker per registered SLA, read and write
  # separately, with a prior of 1 so no evidence means pAdmit = 1 and pAdmit
  # never reaches 0. Pileus multiplies each node's expected profit by the
  # requesting SLA's pAdmit(node); lowest-RTT routing minimizes rtt/pAdmit.
  # When enabled it replaces the Pileus rejection latency-penalty samples.
  admissionAwareRouting: true
  # Per-second decay of the admit/reject counters, in (0, 1); smaller
  # forgets faster (0.9 = a rejection loses half its weight in ~7 s).
  admitRateGamma: 0.9

# SLAs registered per application; requests carry only (applicationId, slaId)
# and the decision policy resolves which rung to pursue. A rung is
# (consistency requirement, end-to-end latency threshold in ms, profit).
# Read rung levels, weakest to strongest:
#   EVENTUAL_LOCAL < EVENTUAL_MAJORITY < CAUSAL_LOCAL < CAUSAL_MAJORITY < LINEARIZABLE
# Write rungs use concern instead: acknowledgments to wait for, 1..majority
# (at majority the write is committed and closes the loss window).
# At most 4 rungs per SLA (the client ledger's satisfied-rung columns are fixed).
slas:
  # A1: online shopping (EXPERIMENT.md). Almost everything is browsing, worth
  # little and stale-tolerant; checkouts must reflect what the shopper just
  # added and pay far more. Three read SLAs make value-ordered shedding
  # observable inside one application (slaId 3 is active only during flash
  # segments). Thresholds sit above the geo level costs so no rung is dead.
  - applicationId: 1
    read:
      # slaId 1, browsing: prefers session-consistent catalogue data, accepts
      # anything committed, accepts anything at all rather than nothing. The
      # only place eventual-majority appears.
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 40
            profit: 5
          - level: EVENTUAL_MAJORITY
            latencyMs: 40
            profit: 4
          - level: EVENTUAL_LOCAL
            latencyMs: 200
            profit: 1.5
      # slaId 2, checkout: the cart must reflect what the shopper just added
      # and must not reflect state that later rolls back.
      - slaId: 2
        rungs:
          - level: CAUSAL_MAJORITY
            latencyMs: 60
            profit: 50
          - level: CAUSAL_LOCAL
            latencyMs: 60
            profit: 38
          - level: EVENTUAL_LOCAL
            latencyMs: 60
            profit: 15
      # slaId 3, flash checkout: active only during flash segments. The floor
      # rises to majority-committed (no eventual rung - the application would
      # rather be refused than oversell), patience rises with it, profit only
      # modestly above ordinary checkout. The one segment where the price
      # cannot economise by downgrading; admission is the only lever.
      - slaId: 3
        rungs:
          - level: LINEARIZABLE
            latencyMs: 300
            profit: 70
          - level: CAUSAL_MAJORITY
            latencyMs: 300
            profit: 52
          - level: CAUSAL_MAJORITY
            latencyMs: 1500
            profit: 30
    # Adding to a cart should be acknowledged instantly; the order record
    # itself must be durable.
    write:
      - slaId: 1
        rungs:
          - concern: 4
            latencyMs: 200
            profit: 12
          - concern: 1
            latencyMs: 40
            profit: 8
          - concern: 1
            latencyMs: 200
            profit: 2
          - concern: 1
            latencyMs: 500
            profit: 1
  # A2: advertising-funded search/news feed. Results may be stale but the
  # reader must not see their own feed go backwards: session ordering, not
  # durability, so causal-local everywhere and the ladder varies only in the
  # deadline (Terry's consistency-favouring class). Writes are rare billing
  # events that always demand full durability - the greedy neighbour the
  # price must contain.
  - applicationId: 2
    read:
      - slaId: 1
        rungs:
          - level: CAUSAL_LOCAL
            latencyMs: 20
            profit: 5
          - level: CAUSAL_LOCAL
            latencyMs: 50
            profit: 4
          - level: CAUSAL_LOCAL
            latencyMs: 120
            profit: 2.5
          - level: CAUSAL_LOCAL
            latencyMs: 400
            profit: 0.25
    write:
      - slaId: 1
        rungs:
          - concern: 4
            latencyMs: 120
            profit: 18
          - concern: 4
            latencyMs: 300
            profit: 12
          - concern: 4
            latencyMs: 800
            profit: 5
          - concern: 4
            latencyMs: 2000
            profit: 0.6
  # A3: login and credential checking. Fast weak read first, authoritative
  # fallback if the check fails: linearizable-fast beats eventual-fast beats
  # linearizable-slow. Two rungs share the 150ms threshold, so a linearizable
  # result must claim the higher-paying one (the only SLA exercising that
  # deduplication). Writes are password changes / session records with a
  # real graded durability tradeoff, and the only place wc:2 appears.
  - applicationId: 3
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 150
            profit: 9
          - level: EVENTUAL_LOCAL
            latencyMs: 150
            profit: 4.5
          - level: LINEARIZABLE
            latencyMs: 600
            profit: 2
    write:
      - slaId: 1
        rungs:
          - concern: 4
            latencyMs: 150
            profit: 15
          - concern: 2
            latencyMs: 120
            profit: 10
          - concern: 1
            latencyMs: 40
            profit: 6
          - concern: 4
            latencyMs: 600
            profit: 4
  # A4: payments and account balances. Low volume, high stakes; the value
  # lives in the writes and the consistency floor rather than a blanket
  # multiplier (a balance read gates the same transaction as a checkout
  # read, but a transfer acknowledged and then lost is in a class of its
  # own). A4 should still be served and upgraded at prices that have shed
  # everyone else.
  - applicationId: 4
    read:
      - slaId: 1
        rungs:
          - level: LINEARIZABLE
            latencyMs: 200
            profit: 50
          - level: CAUSAL_MAJORITY
            latencyMs: 100
            profit: 30
          - level: CAUSAL_MAJORITY
            latencyMs: 400
            profit: 12
    write:
      - slaId: 1
        rungs:
          - concern: 4
            latencyMs: 250
            profit: 150
          - concern: 4
            latencyMs: 1000
            profit: 60

# Failure injection: drop all inter-server RPCs on one node from the start.
nodeFailure:
  enabled: false
  failedNodeId: 0

# Failure schedule (Java store only; the loader rejects a non-empty one with
# transport: mongodb). Events at seconds from the workload start, strictly
# increasing: fail the LEADER the cluster has at that moment or the
# lowest-numbered healthy FOLLOWER, or recover the node that has been failed
# longest. A failed node drops every inter-server RPC and answers clients with
# failures until recovered; at most numServers - majority nodes may be failed
# at once. Empty here; config_failure_*.yaml carry the failure experiment.
#   - { atSeconds: 150, action: fail, target: LEADER }
#   - { atSeconds: 390, action: recover }
failureSchedule: []

# Simulated geo latency, applied and cleared by run_all_cloudlab.sh (Linux
# tc/netem on the node's loopback; the runner rewrites cluster.serverHosts to
# distinct literal loopback IPs 127.0.1.1..N, which the delay rules and the
# servers' outgoing-connection source binding key on). A local run_all.sh run
# refuses geo-enabled configs outright; flip enabled to false for a
# no-delay smoke run on this machine.
geo:
  enabled: true
  # One-way latency in ms added from server i to server j (row i, column j);
  # numServers x numServers, the diagonal must be 0. Local topology
  # (EXPERIMENT.md): five AZs in one region, every server pair at 0.3 ms, so
  # a quorum operation costs about 1.2 ms round trip.
  interServerLatencyMs:
    - [0, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3, 0.1, 0.3, 0.3]
